<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Blue outer circle (magnifying glass lens) -->
  <circle cx="26" cy="26" r="22" fill="none" stroke="#2563EB" stroke-width="5"/>
  <!-- Red inner circle (target) -->
  <circle cx="26" cy="26" r="13" fill="none" stroke="#EA4335" stroke-width="4"/>
  <!-- Green bar chart bars -->
  <rect x="19" y="24" width="4" height="10" rx="1" fill="#34A853"/>
  <rect x="24" y="20" width="4" height="14" rx="1" fill="#34A853"/>
  <rect x="29" y="16" width="4" height="18" rx="1" fill="#34A853"/>
  <!-- Magnifying glass handle -->
  <line x1="42" y1="42" x2="58" y2="58" stroke="#EA4335" stroke-width="6" stroke-linecap="round"/>
</svg>
